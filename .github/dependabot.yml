version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint (used by `npm run lint`) does not support TypeScript 7
      # yet; wait for its support before taking the next major version.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
